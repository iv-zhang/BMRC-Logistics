name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main # or 'master', check your branch name

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # INJECT SECRETS HERE
      # This creates a .env file on the runner using secrets you added in GitHub Settings
      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_ANOTHER_KEY=${{ secrets.NEXT_PUBLIC_ANOTHER_KEY }}" >> .env
          # Add more lines as needed for your specific keys

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BMRC_LOGISTICS }}" # Ensure this matches the secret name you saw
          channelId: live
          projectId: bmrc-logistics # Ensure this matches your project ID
